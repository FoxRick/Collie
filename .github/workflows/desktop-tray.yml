name: Desktop tray

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-tray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tray:
    name: Native tray (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collie-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collie-ui/package-lock.json
      - run: npm ci
      - name: Tray and chat navigation regression tests
        run: npx vitest run src/main/desktop-menu.test.ts src/main/tray-platform.test.ts src/renderer/src/screens/ChatScreen.starter.test.tsx
      - name: Native Electron tray smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop-tray.cjs
      - name: Configure Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native Electron tray smoke under X11
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop-tray.cjs
