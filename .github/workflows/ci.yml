name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collie-core:
    name: collie-core (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collie-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collie-core/pyproject.toml

      - name: Install core with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Install tkinter for the pet tests (best effort)
        # The desktop pet (tests/collie/test_pet_status.py) is a tkinter GUI.
        # python3-tk installs for the system Python; the runner Python may or
        # may not see it — the pytest step below checks the runner Python and
        # falls back to --ignore only when tkinter is genuinely unavailable.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk || echo "python3-tk unavailable; pet tests will be ignored"

      - name: Lint (ruff)
        run: python -m ruff check nanobot collie_core tests

      - name: Format check (ruff format — Collie-owned code only)
        # Vendored nanobot/ and the upstream test suites keep their legacy
        # style; ruff format enforces one canonical style on the code the
        # team writes (collie_core + tests/collie + tests/tools).
        run: python -m ruff format --check collie_core tests/collie tests/tools

      - name: Test (full backend suite, with the coverage gate)
        run: |
          set -o pipefail
          PET=""
          if python -c "import tkinter" >/dev/null 2>&1; then
            echo "tkinter available in the runner Python — pet tests included"
          else
            echo "tkinter unavailable in the runner Python — ignoring pet tests"
            PET="--ignore=tests/collie/test_pet_status.py"
          fi
          # Documented Linux-only failures are deselected, never masked with
          # `|| true`:
          #  - test_services.py credential/connect/disconnect tests exercise
          #    CredentialStore, which raises "Encrypted service credentials
          #    require Windows DPAPI." on non-win32 (collie_core/services/
          #    credentials.py:38).
          #  - test_ipc.py::test_read_write_file_rejects_escape_paths is
          #    Windows-shaped and flaky on Linux (documented in
          #    docs + repo testing notes).
          # These tests are NOT deselected on Windows — the
          # collie-core-windows job runs them for real (see below).
          #
          # The full suite (tests/ — not just tests/collie) gates merges so
          # tests/tools, tests/providers and the rest cannot regress silently.
          #
          # --cov activates the pyproject floor (coverage.report.fail_under
          # = 42). The authoritative baseline lives in pyproject.toml
          # (measured 2026-08-08 on main: ~44.45% with nanobot/webui
          # excluded) — update that note, not this one, when coverage
          # moves.
          python -m pytest tests -q $PET \
            --cov=nanobot --cov=collie_core --cov-report=term-missing \
            --deselect tests/collie/test_services.py::test_credential_store_roundtrip \
            --deselect tests/collie/test_services.py::test_connect_api_key_service \
            --deselect tests/collie/test_services.py::test_connect_oauth_service \
            --deselect tests/collie/test_services.py::test_disconnect_service \
            --deselect tests/collie/test_ipc.py::test_read_write_file_rejects_escape_paths

  # The supported product runtime is Windows + CPython 3.12 (see
  # .github/workflows/release.yml: stage-core.cjs stages python312.dll).
  # The Linux job above deselects five tests that only make sense on
  # Windows (DPAPI-backed CredentialStore + the escape-path check) — this
  # job actually runs them, plus the whole suite, on the real platform.
  collie-core-windows:
    name: collie-core (Python 3.12, Windows — supported runtime)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collie-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collie-core/pyproject.toml

      - name: Install core with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check nanobot collie_core tests

      - name: Format check (ruff format — Collie-owned code only)
        # Same scope as the Linux job: Collie-owned code only, vendored
        # nanobot/ and upstream tests keep legacy style.
        run: python -m ruff format --check collie_core tests/collie tests/tools

      - name: Test (full backend suite, no deselection)
        # Windows is the supported runtime: the DPAPI/service credential
        # tests and the ipc escape-path test that are deselected on Linux
        # must actually pass here. tkinter ships with the setup-python
        # CPython on Windows, so the pet tests run too.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q

  collie-ui:
    name: collie-ui (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collie-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collie-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build (electron-vite)
        run: npm run build

  # The Electron shell only ships on Windows; typecheck + vitest + build on
  # the supported OS catch main-process/updater regressions the Linux job
  # cannot (path separators, native module layout, electron-builder
  # expectations).
  collie-ui-windows:
    name: collie-ui (Node 22, Windows — supported runtime)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collie-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collie-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build (electron-vite)
        run: npm run build
