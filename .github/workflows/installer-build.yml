name: installer-build

on:
  pull_request:
    paths:
      - collie-ui/electron-builder.yml
      - collie-ui/build/**
      - collie-ui/scripts/stage-core.cjs
      - collie-ui/scripts/electron-builder-before-pack.cjs
      - collie-ui/scripts/build-provenance.cjs
      # Main-process/preload changes are the riskiest for packaging and the
      # updater — any PR touching them must prove the real NSIS installer
      # still builds on Windows.
      - collie-ui/src/main/**
      - collie-ui/src/preload/**
      # Workflow changes can silently break the installer or release
      # pipeline — qualify them against the real build too.
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/installer-build.yml
  workflow_dispatch:

# Least-privilege defaults: the job builds an installer for verification and
# reads the repo only; artifact upload uses Actions storage, not repo scope
# (#107).
permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collie-ui/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install UI dependencies
        working-directory: collie-ui
        run: npm ci

      - name: Typecheck
        working-directory: collie-ui
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: collie-ui
        run: npx vitest run

      - name: Build renderer and main process
        working-directory: collie-ui
        run: npm run build

      - name: Create core virtual environment (staging source for the bundle)
        working-directory: collie-core
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e .

      - name: Stage bundled Python core and MCP runtime
        working-directory: collie-ui
        run: npm run stage:core

      - name: Build NSIS installer (assisted wizard)
        working-directory: collie-ui
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: collie-windows-installer
          path: |
            collie-ui/dist/Collie-Setup-*.exe
            collie-ui/dist/Collie-Setup-*.exe.blockmap
            collie-ui/dist/alpha.yml
          if-no-files-found: error
