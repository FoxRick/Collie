appId: com.collie.app
productName: Collie
directories:
  output: dist
  buildResources: build
beforePack: ./scripts/electron-builder-before-pack.cjs
files:
  - out/**
extraResources:
  - from: .electron-bundle/collie-core
    to: collie-core
  - from: .electron-bundle/mcp-runtime
    to: mcp-runtime
  - from: build/icon.png
    to: icon.png
  - from: .electron-bundle/build-provenance.json
    to: collie-build-provenance.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Collie-Setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  warningsAsErrors: false
publish:
  provider: github
  owner: FoxRick
  repo: Collie
  channel: alpha
  releaseType: prerelease
