appId: com.collie.app
productName: Collie
directories:
  output: dist
  buildResources: build
beforePack: ./scripts/electron-builder-before-pack.cjs
files:
  - out/**
extraResources:
  - from: .electron-bundle/collie-core
    to: collie-core
  - from: .electron-bundle/mcp-runtime
    to: mcp-runtime
  - from: build/icon.png
    to: icon.png
  - from: .electron-bundle/build-provenance.json
    to: collie-build-provenance.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Collie-Setup-${version}.exe
nsis:
  # Friendly assisted wizard for nontechnical users: Welcome -> Install mode
  # (per-user recommended, no admin prompt) -> Location (custom only) ->
  # Shortcuts -> Progress -> Finish. Warm copy lives in build/installer.nsh.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - en_US
  include: build/installer.nsh
  warningsAsErrors: false
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Collie-${version}.${ext}
  category: Utility
  maintainer: Collie <hello@heycollie.com>
publish:
  provider: github
  owner: FoxRick
  repo: Collie
  channel: alpha
  releaseType: prerelease
