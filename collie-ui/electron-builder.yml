appId: com.collie.app
productName: Collie
directories:
  output: dist
  buildResources: build
beforePack: ./scripts/electron-builder-before-pack.cjs
files:
  - out/**
extraResources:
  - from: .electron-bundle/collie-core
    to: collie-core
  - from: .electron-bundle/mcp-runtime
    to: mcp-runtime
  - from: build/icon.png
    to: icon.png
  - from: .electron-bundle/build-provenance.json
    to: collie-build-provenance.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Collie-Setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  warningsAsErrors: false
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Collie-${version}.${ext}
  category: Utility
  maintainer: Collie <hello@heycollie.com>
# macOS: unsigned alpha builds (no Apple certificate yet — the CI workflow
# disables identity discovery). build/icon.icns is generated on the mac
# runner from build/icon.png (iconutil) so the branded portrait ships.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Collie-${version}-${arch}.${ext}
  category: public.app-category.productivity
publish:
  provider: github
  owner: FoxRick
  repo: Collie
  channel: alpha
  releaseType: prerelease
