appId: com.collie.app
productName: Collie
directories:
  output: dist
  buildResources: build
beforePack: ./scripts/electron-builder-before-pack.cjs
afterPack: ./scripts/adhoc-sign-mac.cjs
files:
  - out/**
extraResources:
  - from: .electron-bundle/collie-core
    to: collie-core
  - from: .electron-bundle/mcp-runtime
    to: mcp-runtime
  - from: build/icon.png
    to: icon.png
  - from: .electron-bundle/build-provenance.json
    to: collie-build-provenance.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Collie-Setup-${version}.exe
nsis:
  # Friendly assisted wizard for nontechnical users: Welcome -> Install mode
  # (per-user recommended, no admin prompt) -> Location (custom only) ->
  # Shortcuts -> Progress -> Finish. Warm copy lives in build/installer.nsh.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - en_US
  include: build/installer.nsh
  warningsAsErrors: false
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Collie-${version}.${ext}
  category: Utility
  maintainer: Collie <hello@heycollie.com>
# macOS: ad-hoc signed alpha builds (no Apple Developer certificate yet — the
# CI workflow disables identity discovery, and scripts/adhoc-sign-mac.cjs
# applies codesign --force --deep --sign - after packing so Gatekeeper does
# not report the app as "damaged"). build/icon.icns is generated on the mac
# runner from build/icon.png (iconutil) so the branded portrait ships.
# arch: arm64 only — the CI macos runner stages a native-arm64 Python
# runtime, and an x64 .app carrying arm64 python/site-packages would not
# run on Intel Macs. x64/universal2 needs per-arch staged runtimes
# (follow-up, tracked in docs/operations/release).
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: Collie-${version}-${arch}.${ext}
  category: public.app-category.productivity
publish:
  provider: github
  owner: FoxRick
  repo: Collie
  channel: alpha
  releaseType: prerelease
